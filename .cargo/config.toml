# `.cargo/config.toml` (workspace-scoped) — picks up automatically by cargo
# for every `cargo build` / `cargo test` / `cargo bench` invocation in this
# workspace. Same intent as runtime/.cargo/config.toml.
#
# Per-arch tuning. `target-cpu = "x86-64-v3"` enables AVX2, BMI2, FMA, and
# other Haswell+ instructions universally. Other arches fall through to
# cargo's `generic` target-cpu so cross-distro builds remain portable.
# Override locally with:
#
#   CARGO_BUILD_RUSTFLAGS="-C target-cpu=native" cargo build --release
#
# (then watch portability — a native build is locked to the host CPU).
#
# Why this lives in `.cargo/config.toml`, not `[profile.release]` in
# Cargo.toml: at the time this org-wide tuning was being put in place the
# studio root manifest rejected conditional `[target.cfg(...)]` tables for
# the same virtual-manifest reason runtime/ + savers/ hit. `.cargo/config.toml`
# keys by full target triple, which is the correct cargo-incantation for
# per-arch tuning.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]
