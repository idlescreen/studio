name: Studio & Render CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ooda-checks:
    name: Native openOODA (.oo) Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify native openOODA (.oo) studio & render binaries
        run: |
          chmod +x bin/idle-studio bin/render
          ./bin/idle-studio --self-test
          ./bin/render -e beams --duration 1s --dry-run -o /tmp/test-beams.mkv
          ./bin/idle-studio --queue /tmp/test-queue.json enqueue -e aurora --duration 2s --dry-run -o /tmp/test-aurora.mkv
          ./bin/idle-studio --queue /tmp/test-queue.json list
          ./bin/idle-studio --queue /tmp/test-queue.json run --all
