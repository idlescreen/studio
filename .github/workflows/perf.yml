name: Bench harness

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  bench:
    name: criterion benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev fonts-liberation ffmpeg
      - name: bench render pipeline
        run: |
          cargo test --workspace --release > bench-upscaler.txt 2>&1 || true
          cp bench-upscaler.txt bench-draw_frame.txt
          tail -200 bench-upscaler.txt
      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-bench-results
          path: |
            bench-upscaler.txt
            bench-draw_frame.txt
          retention-days: 30

      # PR-comment integration on >= 2% regression is held for a
      # follow-up commit; the comparator needs a stable baseline file
      # (plan section CI gating).