name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must exist)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Skip when the release tag no longer exists
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .ref >/dev/null 2>&1; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::error::tag ${RELEASE_TAG} does not exist"
            exit 1
          else
            echo "::notice::tag ${RELEASE_TAG} no longer exists - the release was retracted, there is nothing to build"
            echo "build=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.build == 'yes'
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify prebuilt native .oo ELF binaries
        if: steps.gate.outputs.build == 'yes'
        run: |
          test -x bin/idle-studio
          test -x bin/render
          ./bin/idle-studio --self-test

      - name: Package .deb and .rpm artifacts
        if: steps.gate.outputs.build == 'yes'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          v="${RELEASE_TAG#v}"
          mkdir -p dist
          for pkg in idle-studio render; do
            stage=$(mktemp -d)
            mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
            cp "bin/$pkg" "$stage/usr/bin/$pkg"
            chmod 0755 "$stage/usr/bin/$pkg"
            cat > "$stage/DEBIAN/control" <<EOF
          Package: $pkg
          Version: ${v}-1
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: IdleScreen <maintainers@idlescreen.github.io>
          Description: IdleScreen Studio native openOODA (.oo) tool ($pkg)
          EOF
            dpkg-deb --build "$stage" "dist/${pkg}_${v}-1_amd64.deb"
            rm -rf "$stage"
          done

      - name: Install Cosign & Sign packages
        if: steps.gate.outputs.build == 'yes'
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/
          shopt -s nullglob
          for file in dist/*.deb dist/*.rpm; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done

      - name: Create Release
        if: steps.gate.outputs.build == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "Native openOODA (.oo) Release $RELEASE_TAG" \
            dist/*
