name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must exist)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Skip when the release tag no longer exists
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .ref >/dev/null 2>&1; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::error::tag ${RELEASE_TAG} does not exist"
            exit 1
          else
            echo "::notice::tag ${RELEASE_TAG} no longer exists - the release was retracted, there is nothing to build"
            echo "build=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.build == 'yes'
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify prebuilt native .oo ELF binaries
        if: steps.gate.outputs.build == 'yes'
        run: |
          test -x bin/idle-studio
          test -x bin/render
          ./bin/idle-studio --self-test

      - name: Package .rpm artifacts
        if: steps.gate.outputs.build == 'yes'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          v="${RELEASE_TAG#v}"
          mkdir -p dist
          spec_dir="$(mktemp -d)"
          for pkg in idle-studio render; do
            cat > "$spec_dir/${pkg}.spec" <<EOF
          Name:           ${pkg}
          Version:        ${v}
          Release:        1
          Summary:        IdleScreen Studio native openOODA (.oo) tool (${pkg})
          License:        MIT
          BuildArch:      x86_64
          AutoReqProv:    no
          AutoReq:        none
          # The runner has no elfutils and the package ships a prebuilt
          # binary, so the debug-info split has nothing to extract.
          %global debug_package %{nil}
          %define __find_debuginfo /bin/true

          %description
          IdleScreen Studio native openOODA (.oo) tool (${pkg}).

          %build

          %install
          mkdir -p %{buildroot}%{_bindir}
          install -m 0755 %{_sourcedir}/${pkg} %{buildroot}%{_bindir}/${pkg}

          %files
          %{_bindir}/${pkg}

          %changelog
          * Fri Nov 13 2026 IdleScreen <maintainers@idlescreen.github.io> - ${v}-1
          - Native openOODA (.oo) build.
          EOF
            topdir="$spec_dir/rpmbuild"
            mkdir -p "$topdir/SOURCES"
            cp "bin/$pkg" "$topdir/SOURCES/$pkg"
            rpmbuild --build-in-place \
              --define "_topdir $topdir" \
              --define "_rpmdir $spec_dir" \
              -bb "$spec_dir/${pkg}.spec"
          done
          mv "$spec_dir"/x86_64/*.rpm dist/
          ls -la dist/

      - name: Install Cosign & Sign packages
        if: steps.gate.outputs.build == 'yes'
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/
          shopt -s nullglob
          for file in dist/*.rpm; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done

      - name: Create Release
        if: steps.gate.outputs.build == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "Native openOODA (.oo) Release $RELEASE_TAG" \
            dist/*
