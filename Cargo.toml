[package]
authors = ["idlescreen developers"]
name = "idle-studio"
version = "1.3.5"
edition = "2021"
license = "Apache-2.0"
description = "IdleScreen Studio — TUI Director for the render capability"
repository = "https://github.com/idlescreen/studio"
readme = "README.md"
default-run = "idle-studio"

[lib]
name = "idle_studio"
path = "src/lib.rs"

[[bin]]
name = "idle-studio"
path = "src/bin/idle-studio/main.rs"

[dependencies]
# Shared job contract with the render engine (in-workspace member).
idle_render = { path = "engine", package = "render" }
crossterm = "0.29"
ratatui = "0.30"
libc = "0.2"

[workspace]
members = ["engine"]
# `runtime/` is the sibling engine checkout (CI) or a symlink to it (local):
# without exclude, path deps under it bind to THIS workspace root and their
# `dep.workspace = true` fields resolve against this workspace's dependencies.
exclude = ["runtime"]
resolver = "2"

[workspace.package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/studio"

[package.metadata.deb]
name = "idle-studio"
copyright = "2026 IdleScreen"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
depends = "libc6, render"
extended-description = "IdleScreen Studio — TUI Director for offline video renders."
section = "utils"
priority = "optional"
assets = [
    ["target/release/idle-studio", "usr/bin/idle-studio", "755"],
    ["assets/io.github.idlescreen.studio.desktop", "usr/share/applications/io.github.idlescreen.studio.desktop", "644"]
]

[package.metadata.generate-rpm]
name = "idle-studio"
release = "1"
arch = "x86_64"
summary = "IdleScreen Director UI (idle-studio)"
description = "IdleScreen Director UI for offline video renders."
license = "Apache-2.0"
assets = [
    { source = "target/release/idle-studio", dest = "/usr/bin/idle-studio", mode = "755" },
    { source = "assets/io.github.idlescreen.studio.desktop", dest = "/usr/share/applications/io.github.idlescreen.studio.desktop", mode = "644" }
]

# Studio shells out to the render binary — same contract as the deb's Depends.
[package.metadata.generate-rpm.requires]
render = "*"
