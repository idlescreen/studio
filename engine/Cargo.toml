[package]
authors = ["idlescreen developers"]
name = "render"
version = "1.2.1"
edition = "2021"
license = "Apache-2.0"
description = "IdleScreen offline export capability — simulation to AV1 video"
repository = "https://github.com/idlescreen/studio"
readme = "../README.md"
keywords = ["idlescreen", "screensaver", "av1", "render"]
categories = ["command-line-utilities", "multimedia"]
default-run = "render"

[lib]
name = "idle_render"
path = "src/lib.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"

[[bin]]
name = "idle-render"
path = "src/bin/idle-render.rs"

[dependencies]
# Path goes outside this workspace so idle's own workspace root applies.
idle-runner = { path = "../runtime/idle-runner" }

[package.metadata.deb]
name = "render"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
copyright = "2026 IdleScreen"
extended-description = "Offline IdleScreen effect renderer (saver math → AV1 via ffmpeg)."
depends = "libc6, ffmpeg | ffmpeg-free | ffmpeg-full"
recommends = "idle-savers"
section = "utils"
priority = "optional"
assets = [
    ["../target/release/render", "usr/bin/render", "755"],
    ["../target/release/idle-render", "usr/bin/idle-render", "755"]
]

[package.metadata.generate-rpm]
name = "render"
release = "1"
arch = "x86_64"
summary = "IdleScreen offline export (render)"
description = "Offline IdleScreen effect renderer — simulation to AV1 video via ffmpeg."
license = "Apache-2.0"
assets = [
    # Workspace builds place binaries in render/target/release (parent of engine/).
    { source = "../target/release/render", dest = "/usr/bin/render", mode = "755", user = "root", group = "root" },
    { source = "../target/release/idle-render", dest = "/usr/bin/idle-render", mode = "755", user = "root", group = "root" }
]

# File dependency: Fedora ships ffmpeg-free; RPM Fusion ships ffmpeg.
# Requiring the binary avoids package-name conflicts (ffmpeg vs ffmpeg-free).
[package.metadata.generate-rpm.requires]
"/usr/bin/ffmpeg" = "*"

[package.metadata.generate-rpm.recommends]
idle-savers = "*"
